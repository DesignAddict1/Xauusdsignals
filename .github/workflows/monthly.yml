name: Monthly trend signal check

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python check_monthly.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save signal state
        run: |
          git config user.name "xauusd-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/monthly.json
          git diff --cached --quiet || git commit -m "Update monthly state [skip ci]"
          git push
